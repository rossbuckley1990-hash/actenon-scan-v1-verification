name: actenon-scan
on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.go'
  push:
    branches: [main]
permissions:
  pull-requests: write
  security-events: write
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Actenon/actenon-scan@v1
        with:
          fail-on: none
          scan-scope: full
      - name: Verify public v1.5.0 consumer artefacts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import actenon_scan

          assert actenon_scan.__version__ == "1.5.0"
          results = json.loads(Path("results.json").read_text())
          assert results["version"] == "1.5.0"
          findings = results["findings"]
          assert len(findings) == 8, findings
          assert {f["language"] for f in findings} == {"python", "typescript", "go"}
          assert {(f["file"], f["line"], f["rule_id"]) for f in findings} == {
              ("tools/example.py", 7, "EXEC-SHELL"),
              ("tools/example.py", 28, "EXEC-SHELL"),
              ("tools/example.py", 33, "EXEC-SHELL"),
              ("tools/example.ts", 11, "EXEC-SHELL"),
              ("tools/example.ts", 25, "DATA-DELETE-FILE-WEAK"),
              ("tools/example.go", 14, "EXEC-SHELL-GO"),
              ("tools/example.go", 23, "DATA-DELETE-OS-GO"),
              ("tools/example.go", 33, "DATA-DELETE-OS-GO"),
          }
          assert results["unsupported"] == {
              "count": 1, "by_language": {"Ruby": 1},
              "files": [{"file": "tools/example.rb", "language": "Ruby"}],
          }, results["unsupported"]
          assert results["analysis_errors"] == []
          sarif = json.loads(Path("results.sarif").read_text())
          assert sarif["version"] == "2.1.0"
          assert len(sarif["runs"][0]["results"]) == 8
          print("PASS: public @v1 installs 1.5.0; eight expected Python/TypeScript/Go findings; Ruby disclosed; no analysis errors; SARIF valid")
          PY
      - name: Preserve consumer verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1.5.0-consumer-evidence
          path: |
            results.json
            results.sarif
            scan-output.txt
